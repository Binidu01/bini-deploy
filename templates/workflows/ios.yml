# Managed by bini-deploy. Edits are overwritten on the next run.
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: 10

      - uses: oven-sh/setup-bun@v2
        if: hashFiles('bun.lock', 'bun.lockb') != ''

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || hashFiles('yarn.lock') != '' && 'yarn' || hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      - name: Generate app icons
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm run tauri:icon
          elif [ -f yarn.lock ]; then yarn run tauri:icon
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun run tauri:icon
          else npm run tauri:icon
          fi

      - name: Initialize iOS project (if missing)
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi

      # A step's own `env:` is not visible to that step's `if:`, so the secrets are
      # exported to $GITHUB_ENV here; the `if: env.X != ''` checks below rely on it.
      # Only secrets that have a value are exported: an empty variable still counts
      # as "set" for tauri, which then tries to sign with nothing and fails.
      - name: Export signing secrets that are set
        shell: bash
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION KEYCHAIN_PASSWORD APPLE_DEVELOPMENT_TEAM APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<__BINI_EOF__"
                echo "$value"
                echo "__BINI_EOF__"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Import Apple certificate and provisioning profile
        if: env.IOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          CERT="$RUNNER_TEMP/cert.p12"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_MOBILE_PROVISION" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Write App Store Connect API key
        if: env.APPLE_API_KEY_P8 != ''
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build iOS app (signed)
        if: env.IOS_CERTIFICATE != '' || env.APPLE_API_KEY_P8 != ''
        run: npx tauri ios build --export-method app-store-connect

      - name: Build iOS app (simulator, unsigned)
        if: env.IOS_CERTIFICATE == '' && env.APPLE_API_KEY_P8 == ''
        run: |
          echo "::warning::No Apple signing credentials; building simulator app only (no IPA)."
          npx tauri ios build --target aarch64-sim

      - name: Read version
        id: version
        shell: bash
        run: |
          v="$(jq -r '.version // empty' package.json)"
          if [ -z "$v" ]; then
            echo "::error title=Version not found::package.json has no version field."
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && (env.IOS_CERTIFICATE != '' || env.APPLE_API_KEY_P8 != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.version.outputs.value }}
          name: App v${{ steps.version.outputs.value }} (iOS)
          generate_release_notes: true
          files: src-tauri/gen/apple/build/**/*.ipa