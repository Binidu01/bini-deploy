# Managed by bini-deploy. Edits are overwritten on the next run.
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: 10

      - uses: oven-sh/setup-bun@v2
        if: hashFiles('bun.lock', 'bun.lockb') != ''

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || hashFiles('yarn.lock') != '' && 'yarn' || hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Select Android NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi

      - name: Generate app icons
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm run tauri:icon
          elif [ -f yarn.lock ]; then yarn run tauri:icon
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then bun run tauri:icon
          else npm run tauri:icon
          fi

      - name: Initialize Android project (if missing)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi

      # A step's own `env:` is not visible to that step's `if:`, so the secrets are
      # exported to $GITHUB_ENV here; the `if: env.X != ''` checks below rely on it.
      # Only secrets that have a value are exported.
      - name: Export signing secrets that are set
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          for name in ANDROID_KEY_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<__BINI_EOF__"
                echo "$value"
                echo "__BINI_EOF__"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Write keystore.properties
        if: env.ANDROID_KEY_BASE64 != ''
        run: |
          KEYSTORE="$RUNNER_TEMP/keystore.jks"
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Warn if unsigned
        if: env.ANDROID_KEY_BASE64 == ''
        run: echo "::warning::No ANDROID_KEY_BASE64; building an unsigned APK/AAB."

      - name: Build Android app
        run: npx tauri android build --apk --aab

      - name: Read version
        id: version
        shell: bash
        run: |
          v="$(jq -r '.version // empty' package.json)"
          if [ -z "$v" ]; then
            echo "::error title=Version not found::package.json has no version field."
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.version.outputs.value }}
          name: App v${{ steps.version.outputs.value }} (Android)
          generate_release_notes: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab